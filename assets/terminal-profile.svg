<svg fill="none" viewBox="0 0 960 420" width="960" height="420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
    .text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 13px; }
    .title { fill: #58a6ff; font-weight: bold; }
    .label { fill: #79c0ff; font-weight: bold; }
    .value { fill: #c9d1d9; }
    .accent { fill: #7ee787; font-weight: bold; }
    .link { fill: #a5d6ff; text-decoration: underline; }
    .border { fill: #484f58; }
  </style>

  <!-- Fundo do Terminal -->
  <rect class="bg" width="100%" height="100%"/>

  <!-- Coluna da Esquerda: Imagem PNG do ASCII -->
  <image href="data:image/png;base64,..." xlink:href="data:image/png;base64,..." x="20" y="20" width="370" height="380" preserveAspectRatio="xMidYMid meet" />

  <!-- Divisória Vertical -->
  <line x1="410" y1="20" x2="410" y2="400" stroke="#30363d" stroke-width="1"/>

  <!-- Coluna da Direita: Informações -->
  <g transform="translate(430, 45)" class="text">
    <text x="0" y="0" class="title">vitoria@ayres <tspan class="border">───────────────────────────────────</tspan></text>
    
    <text x="0" y="32" class="label">OS: <tspan class="value" x="145">Fedora / Nobara Linux</tspan></text>
    <text x="0" y="54" class="label">Role: <tspan class="value" x="145">AI Development Intern</tspan></text>
    <text x="0" y="76" class="label">Education: <tspan class="value" x="145">B.S. Artificial Intelligence @ UNIMAR</tspan></text>
    <text x="0" y="98" class="label">IDE: <tspan class="value" x="145">VS Code, Cursor</tspan></text>
    
    <text x="0" y="140" class="label">AI &amp; ML: <tspan class="accent" x="145">LLMs, RAG, AI Agents, Computer Vision</tspan></text>
    <text x="0" y="162" class="label">Languages: <tspan class="value" x="145">Python, C++, SQL, JavaScript</tspan></text>
    <text x="0" y="184" class="label">Frameworks: <tspan class="value" x="145">LangChain, PyTorch, Pandas, NumPy</tspan></text>
    <text x="0" y="206" class="label">Tools &amp; Tech: <tspan class="value" x="145">Git, PostgreSQL, Docker, Linux</tspan></text>
    <text x="0" y="228" class="label">Languages (Real): <tspan class="value" x="145">Portuguese (Native), English (Advanced)</tspan></text>
    
    <text x="0" y="270" class="title">Contact <tspan class="border">──────────────────────────────────────</tspan></text>
    <text x="0" y="295" class="label">LinkedIn: <tspan class="link" x="145">linkedin.com/in/vitoriaayres</tspan></text>
    <text x="0" y="317" class="label">GitHub: <tspan class="link" x="145">github.com/vitoriaayres</tspan></text>
  </g>
