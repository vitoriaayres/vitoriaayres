    .accent { fill: #7ee787; font-weight: bold; }
    .link { fill: #a5d6ff; text-decoration: underline; }
    .border { fill: #484f58; }
    .ascii { fill: #8b949e; font-family: monospace; font-size: 5.5px; white-space: pre; }
  </style>

